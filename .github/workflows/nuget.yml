name: Publish NuGet
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet build IAW.slnx -c Release
      - run: dotnet test IAW.slnx -c Release
      - run: |
          dotnet pack src/Core/Core.csproj -c Release -o ./nupkgs
          dotnet pack src/Agents/Agents.csproj -c Release -o ./nupkgs
          dotnet pack src/Agents.CSharp/Agents.CSharp.csproj -c Release -o ./nupkgs
          dotnet pack src/Testing/Testing.csproj -c Release -o ./nupkgs
          dotnet pack src/Aspire.Hosting/Aspire.Hosting.csproj -c Release -o ./nupkgs
          dotnet pack src/Aspire.Client/Aspire.Client.csproj -c Release -o ./nupkgs
      - run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
      - run: dotnet nuget push ./nupkgs/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
